[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tollm"
version = "0.0.1"
description = "360° Camera Spatial Intelligence / 3D World Model for LLM Agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tollm contributors" }]
keywords = ["360-camera", "spatial-intelligence", "world-model", "slam", "llm-agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# 核心运行时依赖（M001 只装基础；后续 Mission 在各自 optional-extra 中追加）
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "numpy>=1.26",
    "typing-extensions>=4.10",
]

[project.optional-dependencies]
# 视频摄入/解码（M003/M004 用）
ingest = [
    "av>=12.0",
]
# 视觉/感知（M004/M009/M019 等会用）
vision = [
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "torch>=2.2",
]
# 3D 几何（M015/M016/M017 等）
geometry = [
    "open3d>=0.18",
    "scipy>=1.11",
]
# LLM / Agent（M037/M038 等）
agent = [
    "openai>=1.30",
    "httpx>=0.27",
]
# 开发工具
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "pillow>=10.0",  # M005 合成数据集生成脚本用
    "numpy>=1.26",
    "opencv-python-headless>=4.9",  # M006 标定器测试用
]

[project.urls]
Repository = "https://github.com/your-org/tollm"

[tool.hatch.build.targets.wheel]
packages = ["modules", "agents", "apps"]

# ---------------- uv ----------------
[tool.uv]
package = true
default-groups = ["dev"]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "av>=12.0",
]

# ---------------- ruff ----------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["datasets", "scripts/pb2"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL"]
ignore = [
    "E501",     # line length handled by formatter
    "PLR0913",  # too-many-args: ML/CV APIs naturally have many args
    "PLW0603",  # global statement: used for idempotent logging bootstrap
    "PLC0415",  # import-outside-top-level: lazy import used to avoid cycles & test isolation
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
"scripts/**" = ["PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------- pytest ----------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: lightweight unit tests (auto-applied to tests/unit/**)",
    "integration: tests that touch multiple modules or external resources",
    "slow: tests that take more than 5s",
]
filterwarnings = ["error::DeprecationWarning"]
# Coverage 通过单独命令触发:  uv run pytest --cov=modules --cov=agents --cov=apps

# ---------------- mypy ----------------
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
files = ["modules", "agents", "apps"]
